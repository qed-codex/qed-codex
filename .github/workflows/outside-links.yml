name: Check live outside links
on:
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

jobs:
  outside-links:
    if: github.repository == 'qed-codex/qed-codex'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - name: Crawl the ledger and fail on dead destinations
        run: |
          python -m pip install -r requirements.txt
          python tools/check_links.py proofs/rh/links.tsv "$RUNNER_TEMP/outside-links.json"
          python - "$RUNNER_TEMP/outside-links.json" <<'PY'
          import json, sys
          from pathlib import Path
          dead = json.loads(Path(sys.argv[1]).read_text())["dead"]
          if dead:
              sys.exit(f"{len(dead)} dead outside links")
          PY
