name: Compile proof and verify indexes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
      - name: Install pinned tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python tools/sqlite-runtime.py
          npm ci
          node tools/sweep.mjs --check-inputs
          .venv/bin/python tools/test_origin.py
          .venv/bin/python -m unittest discover -s tools -p test_import_lean_docs.py
          node tools/test-license-byline.mjs
          .venv/bin/python tools/test_informalizations.py
          .venv/bin/python tools/test_math_font.py
          .venv/bin/python tools/test_disputes.py
          .venv/bin/python tools/test_check_links.py
          .venv/bin/python tools/test_directory_links.py
      - name: Fetch the analysis revision and kernel tables
        run: |
          mkdir -p inputs/shore inputs/analysis
          pin=$(.venv/bin/python -c 'import yaml; print(yaml.safe_load(open("proofs/rh/proof.yml"))["analysis_commit"])')
          git -C inputs/analysis init --quiet
          git -C inputs/analysis fetch --quiet --depth=1 https://github.com/qed-codex/riemann-hypothesis-rosetta.git "$pin"
          git -C inputs/analysis checkout --quiet --detach FETCH_HEAD
          release=https://github.com/james-shore/rh-proof-dependencies/releases/download/v0.2.1
          for name in decls.csv.gz constants.csv.gz; do
            curl -fL --retry 3 "$release/$name" -o "inputs/shore/$name"
          done
      - name: Read open module disputes
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python tools/disputes.py inputs/open-disputes.json
      - name: Check live outside links
        if: github.event_name != 'pull_request'
        run: .venv/bin/python tools/check_links.py proofs/rh/links.tsv inputs/outside-link-check.json
      - name: Compile and verify real data
        env:
          REVIEW_FLAGS: ${{ github.event_name == 'pull_request' && '--pr-review' || '' }}
          LINK_CHECK: ${{ github.event_name == 'pull_request' && 'proofs/rh/outside-link-check.json' || 'inputs/outside-link-check.json' }}
          DISPUTE_SOURCE: ${{ github.event_name == 'pull_request' && 'proofs/rh/disputes.json' || 'inputs/open-disputes.json' }}
        run: |
          export LD_LIBRARY_PATH="$PWD/inputs/sqlite/3.46.1${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          .venv/bin/python tools/build.py inputs/analysis inputs/shore --disputes "$DISPUTE_SOURCE"
          .venv/bin/python tools/package.py build/rh.sqlite3 build/preview --preview-probe
          .venv/bin/python tools/verify.py build/rh.sqlite3 build/preview --link-check "$LINK_CHECK" $REVIEW_FLAGS > build/manifest.json
          .venv/bin/python tools/verify_directory.py build/rh.sqlite3 build/preview > build/directory.json
          .venv/bin/python tools/parquet.py build/rh.sqlite3 build/manifest.json build/parquet
          .venv/bin/python -c 'import json; d=json.load(open("build/manifest.json")); print("Verified", len(d["plans"]), "site query plans and", len(d["tableContent"]), "logical tables.")' >> "$GITHUB_STEP_SUMMARY"
      - name: Check public submission limits and packaged headers
        run: |
          .venv/bin/python tools/test_informalization_pr.py build/rh.sqlite3
          .venv/bin/python - <<'PYTHON'
          from pathlib import Path
          rules = Path("build/preview/_headers").read_text().splitlines()
          assert rules[0] == "/*"
          global_headers = set()
          for line in rules[1:]:
              if not line.startswith(" "):
                  break
              global_headers.add(line.strip())
          assert {"X-Content-Type-Options: nosniff", "Referrer-Policy: strict-origin-when-cross-origin"} <= global_headers
          PYTHON
      - name: Check literal search and exact-result pagination
        run: node tools/test-literal-search.mjs build/rh.sqlite3
      - name: Retain the verified build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-manifest
          path: build/manifest.json
          retention-days: 7
